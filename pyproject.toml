[project]
name = "raadweb"
version = "0.1.0"
description = "RAAD landing page: static Arabic and English site on S3 and CloudFront"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-cdk-lib>=2.277.0,<3",
    "constructs>=10.8.1,<11",
    "cdk-nag>=3.0.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.5,<0.18",
    "mypy>=2.4.1,<3",
    "pip-audit>=2.10.1,<3",
    "playwright>=1.65.2,<2",
    "axe-playwright-python>=0.1.8,<0.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raadweb", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "browser: runs a real headless Chromium through Playwright (needs `uv run playwright install chromium`)",
]

[tool.coverage.run]
branch = true
source = ["raadweb", "scripts"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare asserts by design.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["raadweb", "scripts", "app.py"]

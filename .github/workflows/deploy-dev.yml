name: deploy-raadweb-dev

# Every push to main deploys the landing page to dev and then smoke-tests the real host.
# stg and prd promotion is added by the Deployment Pipeline stage.

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-raadweb-dev
  cancel-in-progress: false

# Every action is pinned to a full commit SHA (its release in the comment) and the CDK CLI to
# an exact version matching aws-cdk-lib's major in uv.lock; tests/test_workflows.py checks both.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      RAAD_ENVIRONMENT: dev
      CDK_DEFAULT_REGION: us-east-1
      # Deploy inputs live in the dev environment's variables, never in the code.
      RAADWEB_DOMAIN_NAME: ${{ vars.RAADWEB_DOMAIN_NAME }}
      RAADWEB_CERTIFICATE_ARN: ${{ vars.RAADWEB_CERTIFICATE_ARN }}
      RAAD_HOSTED_ZONE_ID: ${{ vars.RAAD_HOSTED_ZONE_ID }}
      RAADWEB_REQUIRE_BROWSER: "1"
    steps:
      # Checked inside the job, where the dev environment's variables are visible: until the
      # deploy role exists, every later step is skipped and the run stays green.
      - name: Check the dev deploy role is configured
        id: gate
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN_DEV }}
        run: |
          if [ -n "$ROLE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_ROLE_ARN_DEV is not set; the dev deploy is skipped."
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.gate.outputs.ready == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - if: steps.gate.outputs.ready == 'true'
        run: npm install --global aws-cdk@2.1148.1
      - if: steps.gate.outputs.ready == 'true'
        run: uv sync --locked --all-groups
      - if: steps.gate.outputs.ready == 'true'
        run: uv run playwright install --with-deps chromium
      - if: steps.gate.outputs.ready == 'true'
        run: uv run ruff format --check .
      - if: steps.gate.outputs.ready == 'true'
        run: uv run ruff check .
      - if: steps.gate.outputs.ready == 'true'
        run: uv run mypy
      - if: steps.gate.outputs.ready == 'true'
        run: uv run pytest tests --cov=raadweb --cov=scripts --cov-report=term-missing --cov-fail-under=80
      - if: steps.gate.outputs.ready == 'true'
        run: uv run pip-audit
      - if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1
      - if: steps.gate.outputs.ready == 'true'
        name: Build, synth with cdk-nag and deploy
        run: |
          uv run cdk synth -q
          uv run cdk deploy RaadWeb-dev --require-approval never
      - if: steps.gate.outputs.ready == 'true'
        name: Smoke test both languages on the real host
        run: uv run python scripts/smoke_site.py "https://${RAADWEB_DOMAIN_NAME}"
